services:
  postgres:
    image: postgres:16
    container_name: signage_postgres_prd
    restart: always
    env_file:
      - variables.prd.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  webapp:
    image: ghcr.io/gmphan/gp-signage-webapp:latest
    container_name: gp_signage_webapp_prd
    restart: always
    env_file:
      - variables.prd.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./https:/https        # host ./https/dotnetcerts.pfx -> container /https
    depends_on:
      - postgres

  ddns-updater:
    image: qmcgaw/ddns-updater
    container_name: signage_ddns_updater
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./ddns-data:/updater/data

volumes:
  postgres_data:

